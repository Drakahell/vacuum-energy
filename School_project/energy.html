<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Vacuum Energy Viz</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0ff;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 25, 0.8);
            padding: 20px 40px;
            border-radius: 50px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 100, 255, 0.3);
            display: flex;
            gap: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(100, 100, 255, 0.1);
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #8888ff;
        }

        input[type=range] {
            cursor: pointer;
            width: 150px;
            accent-color: #4444ff;
        }

        #overlay-text {
            position: absolute;
            top: 40px;
            left: 40px;
            pointer-events: none;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 8px;
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #4444ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 0.8rem;
            color: #666688;
            max-width: 300px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="overlay-text">
        <h1>Енергія Вакууму</h1>
        <p>Нульові коливання квантових полів. <br>Масштаб: <span id="scale-val">Макро</span></p>
    </div>

    <canvas id="canvas"></canvas>

    <div id="ui-layer">
        <div class="control-group">
            <label>Масштаб (Планковская длина)</label>
            <input type="range" id="scale" min="0" max="100" value="20">
        </div>
        <div class="control-group">
            <label>Частота флуктуаций</label>
            <input type="range" id="freq" min="1" max="100" value="50">
        </div>
        <div class="control-group">
            <label>Плотность частиц</label>
            <input type="range" id="density" min="1" max="100" value="40">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scaleInput = document.getElementById('scale');
        const freqInput = document.getElementById('freq');
        const densityInput = document.getElementById('density');
        const scaleValLabel = document.getElementById('scale-val');

        let width, height;
        let particles = [];
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class VirtualParticle {
            constructor() {
                this.init();
            }

            init() {
                const scaleFactor = parseInt(scaleInput.value) / 100;
                
                // Координаты зависят от масштаба: чем глубже, тем хаотичнее
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                
                // Жизненный цикл (рождение и аннигиляция)
                this.life = 0;
                this.maxLife = Math.random() * (20 - (freqInput.value / 10)) + 5;
                this.size = Math.random() * (5 + scaleFactor * 20);
                
                // Цвет: от холодного синего до раскаленного белого при Планковском масштабе
                const hue = 220 + (scaleFactor * 60);
                const lightness = 40 + (scaleFactor * 50);
                this.color = `hsla(${hue}, 80%, ${lightness}%,`;
                
                this.velocity = {
                    x: (Math.random() - 0.5) * scaleFactor * 10,
                    y: (Math.random() - 0.5) * scaleFactor * 10
                };
            }

            update() {
                this.life++;
                this.x += this.velocity.x;
                this.y += this.velocity.y;

                if (this.life >= this.maxLife) {
                    this.init();
                }
            }

            draw() {
                const opacity = Math.sin((this.life / this.maxLife) * Math.PI);
                const currentSize = this.size * opacity;

                ctx.beginPath();
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, currentSize * 2);
                gradient.addColorStop(0, this.color + opacity + ')');
                gradient.addColorStop(1, this.color + '0)');
                
                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, currentSize * 2, 0, Math.PI * 2);
                ctx.fill();

                // Рисуем квантовую "нить" между частицами при глубоком масштабе
                if (scaleInput.value > 60 && Math.random() > 0.95) {
                    ctx.beginPath();
                    ctx.strokeStyle = this.color + (opacity * 0.2) + ')';
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + (Math.random() - 0.5) * 100, this.y + (Math.random() - 0.5) * 100);
                    ctx.stroke();
                }
            }
        }

        function initParticles() {
            particles = [];
            const count = (width * height / 5000) * (densityInput.value / 10);
            for (let i = 0; i < count; i++) {
                particles.push(new VirtualParticle());
            }
        }

        densityInput.oninput = initParticles;
        scaleInput.oninput = () => {
            const v = scaleInput.value;
            scaleValLabel.innerText = v < 30 ? "Макро" : v < 70 ? "Квантовый предел" : "Планковский масштаб";
        };

        function animate() {
            time += 0.01;
            
            // Эффект накопления/затухания для имитации вязкости пространства
            ctx.fillStyle = `rgba(5, 5, 10, ${0.1 + (1 - scaleInput.value / 100) * 0.2})`;
            ctx.fillRect(0, 0, width, height);

            // Искажение фона (пространство-время)
            if (scaleInput.value > 50) {
                ctx.save();
                ctx.translate(Math.sin(time) * 2, Math.cos(time) * 2);
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            if (scaleInput.value > 50) ctx.restore();

            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
